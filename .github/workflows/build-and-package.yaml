name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        description: 'Runner to use'
        options:
        - 'Runner_integration-web-editor'
        - 'ubuntu-latest'
      version:
        description: 'Version to build (e.g., 4.9.1). Do not include "v" prefix'
        type: string
        required: false
        default: '0.0.0-dev'
      registry:
        description: 'Docker registry to use'
        required: true
        default: docker.wso2.com
      namespace:
        description: 'Docker namespace to use'
        required: true
        default: docker.wso2.com  

env:
  DISABLE_V8_COMPILE_CACHE: 1

jobs:
  build-and-package:
    name: Build code-server and Docker image
    runs-on: ${{ github.event.inputs.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system dependencies
        run: sudo apt update && sudo apt install -y libkrb5-dev libx11-dev libxkbfile-dev

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: quilt
          version: 1.0

      - name: Apply patches
        run: quilt push -a

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/package-lock.json

      - name: Install dependencies
        run: SKIP_SUBMODULE_DEPS=1 npm ci

      - name: Set VERSION
        run: |
          VERSION="${{ inputs.version }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Build code-server
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest lib/vscode rev
        id: vscode-rev
        run: echo "rev=$(git rev-parse HEAD:./lib/vscode)" >> $GITHUB_OUTPUT

      - name: Fetch prebuilt Code package from cache
        id: cache-vscode
        uses: actions/cache@v4
        with:
          path: lib/vscode-reh-web-*
          key: vscode-reh-package-v1-${{ steps.vscode-rev.outputs.rev }}-${{ hashFiles('patches/*.diff', 'ci/build/build-vscode.sh') }}

      - name: Fetch extensions from cache
        uses: actions/cache@v4
        with:
          path: lib/vscode/.build/extensions
          key: vscode-reh-extensions-v1-${{ steps.vscode-rev.outputs.rev }}-${{ hashFiles('patches/*.diff', 'ci/build/build-vscode.sh') }}

      - name: Build vscode
        if: steps.cache-vscode.outputs.cache-hit != 'true'
        run: |
          pushd lib/vscode
          npm ci
          popd
          npm run build:vscode

      - name: Build release package
        run: npm run release

      - name: Update package version
        run: |
          echo "Updating version in release/package.json to $VERSION"
          npm version --prefix release "$VERSION" --no-git-tag-version
          
          echo "Updating version in lib/vscode/product.json"
          tmp=$(mktemp)
          jq ".codeServerVersion = \"$VERSION\"" release/lib/vscode/product.json > "$tmp" && mv "$tmp" release/lib/vscode/product.json
          chmod 644 release/lib/vscode/product.json

      - name: Build standalone and packages
        run: |
          npm run release:standalone
          npm run package amd64

      - name: Extract builtin extensions
        run: |
          mkdir -p builtInExtensions
          tar -czf extensions.tar.gz -C lib/vscode/.build/extensions .
          tar -xzf extensions.tar.gz -C builtInExtensions

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ github.event.inputs.registry }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ci/release-image/Dockerfile
          tags: ${{ github.event.inputs.namespace }}/integration-web-editor:latest,${{ github.event.inputs.namespace }}/integration-web-editor:${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=${{ runner.temp }}/devant-editor.tar
          push: true

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ runner.temp }}/devant-editor.tar
